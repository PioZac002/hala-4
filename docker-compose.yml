# The whole site in one container: the built page plus /api/chat.
#
#   cp .env.example .env     # paste the key for the answer desk (optional)
#   docker compose up --build
#   open http://localhost:8080
#
# Without a key the desk answers from the price list and says so; everything else works.
services:
  web:
    build: .
    image: hala4:latest
    ports:
      - '${PORT:-8080}:8080'
    environment:
      # Passed through from .env when present; unset variables simply stay empty.
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-}
      CHAT_MODEL: ${CHAT_MODEL:-}
      CHAT_REASONING: ${CHAT_REASONING:-}
    restart: unless-stopped
